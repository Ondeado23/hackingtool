<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07110d">
  <title>HackingTool</title>
  <style>
    :root{color-scheme:dark;--bg:#07110d;--panel:#0d1b15;--line:#1f3b2c;--text:#effff5;--muted:#9ab4a5;--accent:#6ef2a2}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 75% 10%,#153523 0,transparent 32%),var(--bg);color:var(--text);font:16px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}main{width:min(920px,100%);margin:auto;padding:24px;min-height:100vh;display:grid;align-content:center}.badge{display:inline-flex;align-items:center;gap:9px;color:var(--accent);font-size:13px;text-transform:uppercase;letter-spacing:.12em}.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 16px var(--accent)}h1{font-size:clamp(44px,11vw,104px);line-height:.94;letter-spacing:-.07em;margin:24px 0}.accent{color:var(--accent)}p{max-width:650px;color:var(--muted);font:clamp(17px,2.5vw,22px)/1.55 system-ui,sans-serif;margin:0}.card{margin-top:48px;border:1px solid var(--line);background:rgba(13,27,21,.86);border-radius:16px;padding:20px;display:flex;gap:14px;align-items:flex-start}.prompt{color:var(--accent);font-weight:700}.card strong{display:block;margin-bottom:4px}.card span{color:var(--muted);font-family:system-ui,sans-serif}@media(max-width:480px){main{padding:22px}.card{margin-top:36px;padding:18px}h1{margin:20px 0}}
  </style>
</head>
<body>
  <main>
    <section aria-labelledby="title">
      <div class="badge"><span class="dot"></span>Workspace online</div>
      <h1 id="title">Hacking<span class="accent">Tool</span></h1>
      <p>A focused security-tool workspace for authorized testing, research, and defensive operations.</p>
      <div class="card">
        <div class="prompt" aria-hidden="true">$</div>
        <div><strong>Deployment entry point ready</strong><span>The web interface can now be published safely.</span></div>
      </div>
    </section>
  </main>
</body>
</html>
